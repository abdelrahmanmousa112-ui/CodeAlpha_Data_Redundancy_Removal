<!DOCTYPE html>
<html>
<head>
    <title>Data Redundancy Removal System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }

        .message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Data Redundancy Removal System</h1>

    <p>Enter user data</p>

    <form action="/add" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            name="phone"
            placeholder="Phone"
            required
        >

        <button type="submit">
            Add Data
        </button>

    </form>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

</div>

</body>
</html>
